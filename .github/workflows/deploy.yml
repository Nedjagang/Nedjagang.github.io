name: Deploy

# Two independent targets, each built from the same commit:
#   - GitHub Pages            https://nedjagang.github.io       (jobs: build -> pages)
#   - Cloudflare Worker       https://dev.praneethveep.me       (job: cloudflare; Worker
#                              `praneeth-dev`, static assets per wrangler.jsonc; needs the
#                              CLOUDFLARE_API_TOKEN repo secret, else skipped)
# A Cloudflare failure never blocks the GitHub Pages deploy, and vice versa.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Account id is not a secret (it is in every dashboard URL). The token is:
  # it needs Account -> Workers Scripts -> Edit, plus Zone -> Workers Routes -> Edit
  # and Zone -> DNS -> Edit on praneethveep.me (for the custom-domain route).
  CLOUDFLARE_ACCOUNT_ID: 7b6c82b86fefbfafb9c96a02e06ba0d6
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Skipped (no CLOUDFLARE_API_TOKEN secret)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret is not set, so dev.praneethveep.me was not updated."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          # wrangler 4 needs Node 22+.
          node-version: 22
          cache: npm

      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''

      - run: npm run build
        if: env.CLOUDFLARE_API_TOKEN != ''

      - name: Deploy to Cloudflare Worker praneeth-dev (dev.praneethveep.me)
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          # The action defaults to wrangler 3.x, which predates this config format.
          wranglerVersion: "4.130.0"
          command: deploy --config wrangler.jsonc
