name: Sync Substack

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/sync-substack.mjs
        env:
          SUBSTACK_FEED_URL: ${{ vars.SUBSTACK_FEED_URL }}

      # No skip-CI marker: synced posts are new content, the deploy SHOULD run.
      - name: Commit and push
        run: |
          git config user.name "substack-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/writing
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -m "content: sync posts from Substack"
          git push
